<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="iscrizioni/style.css" />
  <title>Registrazione evento</title>
</head>

<body>
  <header class="header">
    <img src="../img/title.png" alt="Materia Urbana" width="120" />
    <p>ISCRIVITI ALL'EVENTO</p>
  </header>
  <div class="video-wrapper">
    <video src="../img/video.mov" alt="" autoplay muted loop></video>
  </div>
  <div class="info-wrapper">
    <div class="decoration" aria-hidden="true"></div>
    <div class="event-meta">
      <h1 id="event-name"></h1>
      <h1 class="event-date"></h1>
    </div>

    <h2 class="organizzatori-title">ORGANIZZATORI</h2>
    <ul id="speaker-list" class="speakers"></ul>
    <div class="decoration" aria-hidden="true"></div>
  </div>
  <form id="registration-form">
    <label>
      Nome
      <input type="text" id="name" name="name" required class="input-name" />
    </label>

    <label>
      Email
      <input type="email" id="email" name="email" required />
    </label>

    <button type="submit" id="submit-btn">Conferma iscrizione</button>
  </form>

  <div id="status"></div>

  <script>
    const PUBLIC_ACTION_TRIGGER_URL = 'https://publicactiontrigger.azurewebsites.net/api/dispatches/SUPSI-IDe/cornetto-critico';

    const eventNameEl  = document.getElementById('event-name');
    const eventDateEl  = document.querySelector('.event-date');
    const speakerListEl = document.getElementById('speaker-list');
    const formEl       = document.getElementById('registration-form');
    const statusEl     = document.getElementById('status');
    const submitBtnEl  = document.getElementById('submit-btn');
    let EVENT = null;
    let successMessageTimeoutId = null;

    async function loadEventInfo() {
      const urlCandidates = [
        new URL('./info.json', window.location.href).toString(),
        `${window.location.origin}/iscrizioni/info.json`
      ];

      let lastError = null;
      for (const url of urlCandidates) {
        const res = await fetch(url);
        if (res.ok) {
          return res.json();
        }

        const errorBody = await res.text();
        lastError = new Error(`HTTP ${res.status} ${url} ${errorBody}`);
      }

      throw lastError || new Error('Impossibile caricare info.json');
    }

    function toIsoDateFromDisplay(displayDate) {
      const match = /^([0-3]\d)\.([0-1]\d)\.(\d{4})$/.exec(displayDate.trim());
      if (!match) return null;
      const day = match[1];
      const month = match[2];
      const year = match[3];
      return `${year}-${month}-${day}`;
    }

    function renderEventInfo() {
      eventNameEl.textContent = EVENT.name;
      eventDateEl.textContent = EVENT.displayDate;

      speakerListEl.innerHTML = '';
      EVENT.speakers.forEach(function(speaker) {
        const li = document.createElement('li');
        const mark = document.createElement('mark');
        mark.textContent = speaker;
        li.appendChild(mark);
        speakerListEl.appendChild(li);
      });
    }

    async function initializePage() {
      submitBtnEl.disabled = true;
      statusEl.textContent = 'Caricamento evento...';

      try {
        EVENT = await loadEventInfo();
        renderEventInfo();
        statusEl.textContent = '';
        submitBtnEl.disabled = false;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Errore durante il caricamento evento.';
      }
    }

    initializePage();

    formEl.addEventListener('submit', async function(event) {
      event.preventDefault();

      if (successMessageTimeoutId) {
        clearTimeout(successMessageTimeoutId);
        successMessageTimeoutId = null;
      }

      const attendee_name  = document.getElementById('name').value.trim().toUpperCase();
      const attendee_email = document.getElementById('email').value.trim();
      const selected_event_date = toIsoDateFromDisplay(eventDateEl.textContent || '');

      if (!EVENT || !selected_event_date || !attendee_name || !attendee_email) {
        statusEl.textContent = 'Compila tutti i campi.';
        return;
      }

      if (!PUBLIC_ACTION_TRIGGER_URL || PUBLIC_ACTION_TRIGGER_URL === 'PASTE_PUBLIC_ACTION_TRIGGER_URL_HERE') {
        statusEl.textContent = 'Configurazione mancante.';
        return;
      }

      submitBtnEl.disabled = true;
      statusEl.textContent = 'Invio in corso...';

      try {
        const registrationPayload = {
          event_slug: EVENT.slug,
          event_name: EVENT.name,
          event_date: selected_event_date,
          attendee_name,
          attendee_email,
          speaker_names: EVENT.speakers,
          print_status: 'pending'
        };

        const res = await fetch(PUBLIC_ACTION_TRIGGER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'register-attendee',
            client_payload: registrationPayload
          })
        });

        if (!res.ok) {
          const errorBody = await res.text();
          throw new Error(`HTTP ${res.status} ${errorBody}`);
        }

        formEl.reset();
        statusEl.textContent = 'Iscrizione confermata.';

        successMessageTimeoutId = setTimeout(function() {
          statusEl.textContent = '';
          successMessageTimeoutId = null;
        }, 30000);
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Errore durante la registrazione.';
      } finally {
        submitBtnEl.disabled = false;
      }
    });
  </script>
</body>

</html>
