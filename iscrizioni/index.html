<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../iscrizioni/style.css" />
  <title>Registrazione evento</title>
</head>

<body>
  <header class="header">
    <img src="../img/title.png" alt="Materia Urbana" width="120" />
    <p>ISCRIVITI ALL'EVENTO</p>
  </header>
  <div class="video-wrapper">
    <video src="../img/video.mov" alt="" autoplay muted loop></video>
  </div>
  <div class="info-wrapper">
    <div class="decoration" aria-hidden="true"></div>
    <div class="event-meta">
      <h1 id="event-name"></h1>
      <h1 class="event-date"></h1>
    </div>

    <h2 class="organizzatori-title">ORGANIZZATORI</h2>
    <ul id="speaker-list" class="speakers"></ul>
    <div class="decoration" aria-hidden="true"></div>
  </div>
  <form id="registration-form">
    <label>
      Nome
      <input type="text" id="name" name="name" required class="input-name" />
    </label>

    <label>
      Email
      <input type="email" id="email" name="email" required />
    </label>

    <button type="submit" id="submit-btn">Conferma iscrizione</button>
  </form>

  <div id="status"></div>

  <dialog id="print-dialog">
    <div class="decoration" aria-hidden="true"></div>
    <div id="print-countdown">
      <p>STAMPA SCONTRINO IN CORSO</p>
      <p class="countdown-number" aria-live="polite"></p>
    </div>
    <div id="print-tear" hidden>
      <img id="print-gif" alt="Strappa lo scontrino verso l'alto" width="256" height="256" />
      <p><mark>STRAPPA VERSO L'ALTO</mark></p>
    </div>
    <div id="print-error" role="alert" hidden>
      <p>ISCRIZIONE EFFETTUATA</p>
      <p class="print-error-title">ERRORE DI STAMPA</p>
      <p><mark>CONTATTA LO STAFF PER RICEVERE IL TUO SCONTRINO</mark></p>
      <button type="button" id="print-error-close">OK</button>
    </div>
    <div class="decoration" aria-hidden="true"></div>
  </dialog>

  <script>
    const PUBLIC_ACTION_TRIGGER_URL = 'https://cornetto-critico.hi-bef.workers.dev/';

    const eventNameEl  = document.getElementById('event-name');
    const eventDateEl  = document.querySelector('.event-date');
    const speakerListEl = document.getElementById('speaker-list');
    const formEl       = document.getElementById('registration-form');
    const statusEl     = document.getElementById('status');
    const submitBtnEl  = document.getElementById('submit-btn');
    let EVENT = null;
    let successMessageTimeoutId = null;

    const printDialogEl = document.getElementById('print-dialog');
    const printCountdownEl = document.getElementById('print-countdown');
    const printTearEl = document.getElementById('print-tear');
    const printGifEl = document.getElementById('print-gif');
    const printErrorEl = document.getElementById('print-error');
    const countdownNumberEl = printDialogEl.querySelector('.countdown-number');
    let printTimers = [];
    let printJob = 0; // cambia a ogni pop-up: i controlli di stampa di un pop-up vecchio si fermano

    const PRINT_CHECK_EVERY_MS = 2000;
    const PRINT_TIMEOUT_MS = 25000; // la scheda controlla la coda ogni 5s: una stampa riuscita è confermata in ~10-15s

    const sleep = function(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); };

    function closePrintDialog() {
      printJob++;
      printTimers.forEach(clearTimeout);
      printTimers = [];
      if (printDialogEl.open) printDialogEl.close();
    }

    function showPrintStep(stepEl) {
      [printCountdownEl, printTearEl, printErrorEl].forEach(function(el) { el.hidden = el !== stepEl; });
    }

    // 10s di countdown "stampa in corso"; poi gif o errore lo decide followPrint
    function showPrintDialog() {
      closePrintDialog();
      showPrintStep(printCountdownEl);
      countdownNumberEl.textContent = '';
      printDialogEl.showModal();

      for (let s = 10; s >= 1; s--) {
        printTimers.push(setTimeout(function() { countdownNumberEl.textContent = s; }, (10 - s) * 1000));
      }
      printTimers.push(setTimeout(function() { countdownNumberEl.textContent = ''; }, 10000));
    }

    function showTear() {
      showPrintStep(printTearEl);
      printGifEl.src = '../img/strappa.gif?t=' + Date.now(); // riparte dal primo frame
      printTimers.push(setTimeout(closePrintDialog, 10000));
    }

    function showPrintError() {
      showPrintStep(printErrorEl);
      document.getElementById('print-error-close').focus();
      printTimers.push(setTimeout(closePrintDialog, 60000)); // il tablet non resta bloccato se nessuno preme OK
    }

    async function isPrinted(id) {
      try {
        const res = await fetch(PUBLIC_ACTION_TRIGGER_URL + '?id=' + encodeURIComponent(id));
        return res.ok && (await res.json()).status === 'printed';
      } catch (err) {
        return false; // rete o worker giù: riprova al giro dopo, a fine attesa vale come errore
      }
    }

    // id = numero dell'iscrizione dato dal worker; senza id (worker vecchio) mostra la gif come prima
    async function followPrint(id) {
      const job = printJob;
      const countdownDone = sleep(10000);
      let printed = !id;
      const deadline = Date.now() + PRINT_TIMEOUT_MS;

      while (!printed && Date.now() < deadline) {
        await sleep(PRINT_CHECK_EVERY_MS);
        if (job !== printJob) return;
        printed = await isPrinted(id);
      }

      await countdownDone;
      if (job !== printJob) return;
      if (printed) showTear(); else showPrintError();
    }

    printDialogEl.addEventListener('cancel', function(e) { e.preventDefault(); });
    document.getElementById('print-error-close').addEventListener('click', closePrintDialog);

    async function loadEventInfo() {
      const urlCandidates = [
        new URL('./info.json', window.location.href).toString(),
        `${window.location.origin}/iscrizioni/info.json`
      ];

      let lastError = null;
      for (const url of urlCandidates) {
        const res = await fetch(url);
        if (res.ok) {
          return res.json();
        }

        const errorBody = await res.text();
        lastError = new Error(`HTTP ${res.status} ${url} ${errorBody}`);
      }

      throw lastError || new Error('Impossibile caricare info.json');
    }

    function toIsoDateFromDisplay(displayDate) {
      const match = /^([0-3]\d)\.([0-1]\d)\.(\d{4})$/.exec(displayDate.trim());
      if (!match) return null;
      const day = match[1];
      const month = match[2];
      const year = match[3];
      return `${year}-${month}-${day}`;
    }

    function renderEventInfo() {
      eventNameEl.textContent = EVENT.name;
      eventDateEl.textContent = EVENT.displayDate;

      speakerListEl.innerHTML = '';
      EVENT.speakers.forEach(function(speaker) {
        const li = document.createElement('li');
        const mark = document.createElement('mark');
        mark.textContent = speaker;
        li.appendChild(mark);
        speakerListEl.appendChild(li);
      });
    }

    async function initializePage() {
      submitBtnEl.disabled = true;
      statusEl.textContent = 'Caricamento evento...';

      try {
        EVENT = await loadEventInfo();
        renderEventInfo();
        statusEl.textContent = '';
        submitBtnEl.disabled = false;
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Errore durante il caricamento evento.';
      }
    }

    initializePage();

    formEl.addEventListener('submit', async function(event) {
      event.preventDefault();

      if (successMessageTimeoutId) {
        clearTimeout(successMessageTimeoutId);
        successMessageTimeoutId = null;
      }

      const attendee_name  = document.getElementById('name').value.trim().toUpperCase();
      const attendee_email = document.getElementById('email').value.trim();
      const selected_event_date = toIsoDateFromDisplay(eventDateEl.textContent || '');

      if (!EVENT || !selected_event_date || !attendee_name || !attendee_email) {
        statusEl.textContent = 'Compila tutti i campi.';
        return;
      }

      if (!PUBLIC_ACTION_TRIGGER_URL || PUBLIC_ACTION_TRIGGER_URL === 'PASTE_PUBLIC_ACTION_TRIGGER_URL_HERE') {
        statusEl.textContent = 'Configurazione mancante.';
        return;
      }

      submitBtnEl.disabled = true;
      statusEl.textContent = 'Invio in corso...';
      document.activeElement.blur(); // chiude la tastiera su mobile
      showPrintDialog();

      try {
        const registrationPayload = {
          event_slug: EVENT.slug,
          event_name: EVENT.name,
          event_date: selected_event_date,
          attendee_name,
          attendee_email,
          speaker_names: EVENT.speakers,
          print_status: 'pending'
        };

        const res = await fetch(PUBLIC_ACTION_TRIGGER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'register-attendee',
            client_payload: registrationPayload
          })
        });

        if (!res.ok) {
          const errorBody = await res.text();
          throw new Error(`HTTP ${res.status} ${errorBody}`);
        }

        const data = await res.json().catch(function() { return {}; }); // il worker vecchio risponde "ok", non JSON
        followPrint(data.id);

        formEl.reset();
        statusEl.textContent = 'Iscrizione confermata.';

        successMessageTimeoutId = setTimeout(function() {
          statusEl.textContent = '';
          successMessageTimeoutId = null;
        }, 30000);
      } catch (err) {
        console.error(err);
        closePrintDialog();
        statusEl.textContent = 'Errore durante la registrazione.';
      } finally {
        submitBtnEl.disabled = false;
      }
    });
  </script>
</body>

</html>
