name: Register Attendee

on:
  repository_dispatch:
    types: [register-attendee]
  workflow_dispatch:
    inputs:
      event_slug:
        description: Event slug
        required: true
        type: string
      event_name:
        description: Event name
        required: true
        type: string
      event_date:
        description: Event date (YYYY-MM-DD)
        required: true
        type: string
      attendee_name:
        description: Attendee name
        required: true
        type: string
      attendee_email:
        description: Attendee email
        required: true
        type: string
      speaker_names:
        description: Speaker names as JSON array string
        required: true
        type: string
      print_status:
        description: Print status
        required: true
        default: pending
        type: string

# Il job non usa GITHUB_TOKEN: nessun permesso.
permissions: {}

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      # I dati arrivano da utenti esterni: passano solo come variabili d'ambiente,
      # mai scritti dentro lo script con ${{ }}, così non possono diventare comandi.
      - name: Build registration payload
        id: payload
        env:
          TRIGGER: ${{ github.event_name }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          IN_EVENT_SLUG: ${{ github.event.inputs.event_slug }}
          IN_EVENT_NAME: ${{ github.event.inputs.event_name }}
          IN_EVENT_DATE: ${{ github.event.inputs.event_date }}
          IN_ATTENDEE_NAME: ${{ github.event.inputs.attendee_name }}
          IN_ATTENDEE_EMAIL: ${{ github.event.inputs.attendee_email }}
          IN_SPEAKER_NAMES: ${{ github.event.inputs.speaker_names }}
          IN_PRINT_STATUS: ${{ github.event.inputs.print_status }}
        run: |
          set -euo pipefail

          if [ "$TRIGGER" = "repository_dispatch" ]; then
            # Solo i campi previsti; print_status forzato: chi invia non può segnare "printed".
            PAYLOAD_JSON=$(printf '%s' "$CLIENT_PAYLOAD" | jq -c '{
              event_slug, event_name, event_date, attendee_name, attendee_email, speaker_names,
              print_status: "pending"
            }')
          else
            if ! printf '%s' "$IN_SPEAKER_NAMES" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "speaker_names must be a JSON array string"
              exit 1
            fi

            PAYLOAD_JSON=$(jq -cn \
              --arg event_slug "$IN_EVENT_SLUG" \
              --arg event_name "$IN_EVENT_NAME" \
              --arg event_date "$IN_EVENT_DATE" \
              --arg attendee_name "$IN_ATTENDEE_NAME" \
              --arg attendee_email "$IN_ATTENDEE_EMAIL" \
              --arg print_status "$IN_PRINT_STATUS" \
              --argjson speaker_names "$IN_SPEAKER_NAMES" \
              '{
                event_slug: $event_slug,
                event_name: $event_name,
                event_date: $event_date,
                attendee_name: $attendee_name,
                attendee_email: $attendee_email,
                speaker_names: $speaker_names,
                print_status: $print_status
              }')
          fi

          if ! printf '%s' "$PAYLOAD_JSON" | jq -e '.event_date | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")' >/dev/null; then
            echo "event_date must be in YYYY-MM-DD format"
            exit 1
          fi

          # jq -c produce una sola riga (gli a capo nei valori sono escapati), quindi l'output non può essere spezzato.
          echo "json=$PAYLOAD_JSON" >> "$GITHUB_OUTPUT"

      - name: Insert registration into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAYLOAD: ${{ steps.payload.outputs.json }}
        run: |
          curl --fail -sS \
            -X POST \
            "${SUPABASE_URL}/rest/v1/registrations" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "${PAYLOAD}"
