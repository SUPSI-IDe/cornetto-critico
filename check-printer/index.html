<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Monitor</title>
  <style>
    @font-face {
      font-family: NeueMontreal;
      src: url("../fonts/OTNeueMontreal-MediumSqueezed.otf");
    }

    body {
      margin: 0;
      font-family: NeueMontreal, sans-serif;
      background: #f5f5f0;
      color: #111;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 28px;
      text-transform: uppercase;
    }

    .box {
      border: 1px solid #111;
      background: #fff;
      padding: 14px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .kpi {
      font-size: 26px;
      line-height: 1;
      margin-top: 4px;
    }

    .muted {
      color: #555;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .alert {
      color: #b10000;
    }

    button {
      border: 1px solid #111;
      background: #111;
      color: #fff;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
      text-transform: uppercase;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      border-top: 1px solid #ddd;
      padding: 10px 0;
    }

    li:first-child {
      border-top: 0;
      padding-top: 0;
    }

    @media (max-width: 560px) {
      .kpi {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Pending Print Monitor</h1>

    <section class="box">
      <div class="row">
        <div>
          <div class="muted">Pending Totali</div>
          <div class="kpi" id="pending-total">0</div>
        </div>
        <div>
          <div class="muted">Oltre 5 Min</div>
          <div class="kpi" id="pending-stale">0</div>
        </div>
        <div>
          <div class="muted">Prossimo Controllo GitHub</div>
          <div class="kpi" id="next-github-check">--:--</div>
        </div>
      </div>
    </section>

    <section class="box row">
      <div>
        <div class="muted">Stato</div>
        <div id="status-label">Inizializzazione</div>
        <div class="muted" id="snapshot-updated-at" style="margin-top: 6px;">Snapshot: --</div>
      </div>
      <button id="enable-notifications" type="button">Abilita Notifiche</button>
    </section>

    <section class="box">
      <div class="muted" style="margin-bottom: 8px;">Coda Pending</div>
      <ul id="queue-list">
        <li>Nessuna registrazione pending.</li>
      </ul>
    </section>
  </main>

  <script>
    const CONFIG = {
      pendingJsonPaths: ['./pending.json', '/check-printer/pending.json'],
      staleAfterMs: 5 * 60 * 1000,
      dashboardPollMs: 10000,
      githubActionIntervalMs: 5 * 60 * 1000
    };

    const state = {
      notifiedIds: new Set(),
      nextGithubCheckAt: null
    };

    const pendingTotalEl = document.getElementById('pending-total');
    const pendingStaleEl = document.getElementById('pending-stale');
    const nextGithubCheckEl = document.getElementById('next-github-check');
    const statusLabelEl = document.getElementById('status-label');
    const snapshotUpdatedAtEl = document.getElementById('snapshot-updated-at');
    const queueListEl = document.getElementById('queue-list');
    const enableNotificationsButtonEl = document.getElementById('enable-notifications');

    function formatAge(ms) {
      if (!Number.isFinite(ms) || ms < 0) {
        return 'n/d';
      }
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}m ${String(seconds).padStart(2, '0')}s`;
    }

    function getSnapshotRows(payload) {
      if (Array.isArray(payload)) {
        return payload;
      }

      // Empty payloads are valid and mean no pending records.
      if (payload == null) {
        return [];
      }

      if (payload && Array.isArray(payload.pending)) {
        return payload.pending;
      }

      if (payload && Array.isArray(payload.registrations)) {
        return payload.registrations;
      }

      // Accept empty objects as an empty queue.
      if (payload && typeof payload === 'object' && Object.keys(payload).length === 0) {
        return [];
      }

      return null;
    }

    function setStatus(text, isAlert) {
      statusLabelEl.textContent = text;
      statusLabelEl.classList.toggle('alert', Boolean(isAlert));
    }

    function formatDateTime(value) {
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) {
        return 'data non valida';
      }
      return new Intl.DateTimeFormat('it-CH', {
        dateStyle: 'short',
        timeStyle: 'medium'
      }).format(date);
    }

    function computeNextGithubCheck(baseDate) {
      const baseMs = baseDate.getTime();
      const interval = CONFIG.githubActionIntervalMs;
      const nextMs = Math.floor(baseMs / interval) * interval + interval;
      return new Date(nextMs);
    }

    function renderNextGithubCountdown() {
      if (!state.nextGithubCheckAt) {
        nextGithubCheckEl.textContent = '--:--';
        return;
      }

      const remaining = state.nextGithubCheckAt.getTime() - Date.now();
      if (remaining <= 0) {
        nextGithubCheckEl.textContent = '00:00';
        return;
      }

      const totalSeconds = Math.floor(remaining / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      nextGithubCheckEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    async function fetchSnapshot() {
      let lastError = null;

      for (const path of CONFIG.pendingJsonPaths) {
        try {
          const response = await fetch(`${path}?t=${Date.now()}`, {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              Pragma: 'no-cache'
            }
          });

          if (!response.ok) {
            lastError = new Error(`Snapshot ${response.status} (${path})`);
            continue;
          }

          const rawText = await response.text();
          const trimmedText = rawText.trim();
          const payload = trimmedText ? JSON.parse(trimmedText) : [];
          const rows = getSnapshotRows(payload);
          if (!rows) {
            lastError = new Error(`Formato pending.json non valido (${path})`);
            continue;
          }

          return {
            updated_at: payload && payload.updated_at ? payload.updated_at : null,
            pending: rows
          };
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error('Impossibile leggere pending.json');
    }

    function normalizeRows(rows) {
      const now = Date.now();
      return rows.map(function(row) {
        const createdAtRaw = row.created_at || row.createdAt || null;
        const createdAtMs = createdAtRaw ? Date.parse(createdAtRaw) : NaN;
        const ageMs = Number.isFinite(createdAtMs) ? Math.max(0, now - createdAtMs) : NaN;
        const printStatus = String(row.print_status || row.printStatus || 'pending').toLowerCase();
        return {
          id: row.id,
          eventName: row.event_name || 'Evento sconosciuto',
          createdAtRaw,
          printStatus,
          ageMs,
          isStale: Number.isFinite(ageMs) && ageMs >= CONFIG.staleAfterMs
        };
      }).filter(function(row) {
        return row.printStatus === 'pending';
      });
    }

    function renderQueue(items) {
      if (!items.length) {
        queueListEl.innerHTML = '<li>Nessuna registrazione pending.</li>';
        return;
      }

      queueListEl.innerHTML = items.map(function(item) {
        const stale = item.isStale ? ' - OLTRE 5 MIN' : '';
        const ageLabel = Number.isFinite(item.ageMs) ? `In coda da ${formatAge(item.ageMs)}` : 'Data creazione non disponibile';
        return `<li><strong>#${item.id}</strong> ${item.eventName}<br><span class="muted">${ageLabel}${stale}</span></li>`;
      }).join('');
    }

    function notifyStale(items) {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        return;
      }

      items.forEach(function(item) {
        if (!item.isStale || state.notifiedIds.has(item.id)) {
          return;
        }

        new Notification('Pending oltre 5 minuti', {
          body: `Registrazione #${item.id} (${item.eventName}) in coda da ${formatAge(item.ageMs)}.`,
          tag: `pending-${item.id}`,
          requireInteraction: true
        });

        state.notifiedIds.add(item.id);
      });

      const ids = new Set(items.map(function(item) { return item.id; }));
      Array.from(state.notifiedIds).forEach(function(id) {
        if (!ids.has(id)) {
          state.notifiedIds.delete(id);
        }
      });
    }

    async function refreshDashboard() {
      try {
        setStatus('Controllo in corso', false);
        const snapshot = await fetchSnapshot();
        const items = normalizeRows(snapshot.pending);
        const staleCount = items.filter(function(item) { return item.isStale; }).length;

        pendingTotalEl.textContent = String(items.length);
        pendingStaleEl.textContent = String(staleCount);
        renderQueue(items);
        notifyStale(items);

        const parsedUpdatedAt = snapshot.updated_at ? new Date(snapshot.updated_at) : null;
        const snapshotDate = parsedUpdatedAt && !Number.isNaN(parsedUpdatedAt.getTime()) ? parsedUpdatedAt : new Date();
        state.nextGithubCheckAt = computeNextGithubCheck(snapshotDate);
        renderNextGithubCountdown();
        snapshotUpdatedAtEl.textContent = `Snapshot: ${formatDateTime(snapshot.updated_at || snapshotDate.toISOString())}`;

        if (staleCount > 0) {
          setStatus(`${staleCount} pending oltre soglia`, true);
        } else if (items.length > 0) {
          setStatus('Coda presente sotto soglia', false);
        } else {
          setStatus('Nessun pending', false);
        }
      } catch (error) {
        setStatus(`Errore: ${error.message}`, true);
        pendingTotalEl.textContent = '0';
        pendingStaleEl.textContent = '0';
        state.nextGithubCheckAt = null;
        renderNextGithubCountdown();
        renderQueue([]);
        snapshotUpdatedAtEl.textContent = 'Snapshot: errore caricamento';
      }
    }

    enableNotificationsButtonEl.addEventListener('click', async function() {
      if (!('Notification' in window)) {
        setStatus('Notifiche non supportate da questo browser', true);
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        setStatus('Notifiche abilitate', false);
      } else {
        setStatus(`Permesso notifiche: ${permission}`, true);
      }
    });

    refreshDashboard();
    window.setInterval(refreshDashboard, CONFIG.dashboardPollMs);
    window.setInterval(renderNextGithubCountdown, 1000);
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        refreshDashboard();
      }
    });
  </script>
</body>

</html>
